openapi: 3.1.0
info:
  title: Dream App API
  version: v1
  description: |
    Dream 客户端（Web / Android WebView）与本地转发服务端之间的接口契约。
    完整说明（SSE 事件顺序、错误码、客户端处理规则）见 docs/api.md。

    - 除 health / models 外，端点要求 `Authorization: Bearer <token>`。
    - 对话为无状态流式接口：历史消息由客户端在 `messages` 中回传。
servers:
  - url: http://127.0.0.1:8787
    description: 本地开发
  - url: http://localhost:5173
    description: Web 开发服务器（Vite 代理 /api）
tags:
  - name: system
  - name: chat
  - name: models
  - name: auth
  - name: import

paths:
  /api/v1/health:
    get:
      tags: [system]
      summary: 服务健康与能力探测
      operationId: getHealth
      responses:
        "200":
          description: 服务状态
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-Api-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                apiVersion: v1
                serverVersion: 0.2.0
                serverTime: "2026-11-18T15:20:00.000Z"
                mock: false
                hasApiKey: true
                models:
                  default: deepseek-chat
                  reasoner: deepseek-reasoner

  /api/v1/models:
    get:
      tags: [models]
      summary: 列出服务端配置的模型
      operationId: listModels
      responses:
        "200":
          description: 模型列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-Api-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Model"
              example:
                data:
                  - id: deepseek-chat
                    thinking: false
                    default: true
                  - id: deepseek-reasoner
                    thinking: true
                    default: false

  /api/v1/chat:
    post:
      tags: [chat]
      summary: 发起流式对话（Server-Sent Events）
      description: |
        成功时返回 `text/event-stream`。事件顺序：

        `start` → (`thinking` | `delta`)* → (`done` | `error`)

        - `thinking` / `delta` 的 data 为 `{"delta":"..."}`
        - `done` 的 data 为 `{"requestId","finishReason","createdAt"}`
        - 流建立之后的错误通过 `event: error` 返回，不再发送 `done`
        - 客户端断开连接会同步中止上游请求
      operationId: createChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            example:
              messages:
                - role: user
                  content: 用一句话解释 CAP 定理
              thinking: false
      responses:
        "200":
          description: SSE 流式生成
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-Api-Version:
              $ref: "#/components/headers/ApiVersion"
            Cache-Control:
              schema:
                type: string
                example: no-cache, no-transform
          content:
            text/event-stream:
              schema:
                type: string
                description: 按 SSE 编码的 Dream 事件流
              examples:
                stream:
                  summary: 典型事件序列
                  value: |
                    event: start
                    data: {"requestId":"req_demo_001","model":"deepseek-chat","thinking":false,"createdAt":"2026-11-18T15:20:00.000Z"}

                    event: thinking
                    data: {"delta":"用户想知道 CAP。"}

                    event: delta
                    data: {"delta":"CAP 定理指"}

                    event: done
                    data: {"requestId":"req_demo_001","finishReason":"stop","createdAt":"2026-11-18T15:20:04.120Z"}
              x-sse-events:
                start:
                  description: 连接建立，发送一次
                  data:
                    requestId: string
                    model: string
                    thinking: boolean
                    createdAt: string
                thinking:
                  description: 思考增量（thinking=true 时）
                  data:
                    delta: string
                delta:
                  description: 正文增量
                  data:
                    delta: string
                done:
                  description: 正常结束，发送一次
                  data:
                    requestId: string
                    finishReason: stop | length | content_filter | unknown
                    createdAt: string
                error:
                  description: 流内错误，发送后结束
                  data:
                    error:
                      code: string
                      message: string
                      requestId: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/UpstreamNotConfigured"

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: 注册并登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                password: { type: string, minLength: 8, maxLength: 128 }
                displayName: { type: string, maxLength: 32 }
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me:
    get:
      tags: [auth]
      summary: 当前登录用户
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/import/share:
    get:
      tags: [import]
      summary: 通过 DeepSeek 分享链接导入会话
      security:
        - bearerAuth: []
      parameters:
        - name: url
          in: query
          required: true
          description: 完整分享链接或 16–64 位分享 id
          schema: { type: string }
      responses:
        "200":
          description: 归一化后的分享内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedChat"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/v1/admin/stats:
    get:
      tags: [admin]
      summary: 管理后台聚合统计（用户 / 请求 / Token / Key）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 统计数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  generatedAt: { type: string, format: date-time }
                  components: { type: object, additionalProperties: true }
                  totals: { type: object, additionalProperties: true }
                  users: { type: array, items: { type: object, additionalProperties: true } }
                  keys: { type: array, items: { type: object, additionalProperties: true } }
                  days: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  headers:
    RequestId:
      description: 服务端生成的请求 ID，用于日志关联
      schema:
        type: string
        example: req_9f1c2a7b
    ApiVersion:
      description: API 版本
      schema:
        type: string
        example: v1

  responses:
    BadRequest:
      description: 请求参数错误
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: 请求体超过 8 MiB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Content-Type 不是 application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未登录或 token 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 用户名已被占用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 没有管理员权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: 请求合法但无法处理
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: DeepSeek 鉴权失败或返回错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamNotConfigured:
      description: 服务端未配置 DEEPSEEK_API_KEY
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        isAdmin: { type: boolean }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    SharedMessage:
      type: object
      required: [role, content, reasoning, status, createdAt]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        reasoning: { type: string }
        status: { type: string, enum: [done, error] }
        createdAt: { type: integer, description: Unix 毫秒 }
    SharedChat:
      type: object
      properties:
        shareId: { type: string }
        title: { type: string }
        attachments: { type: integer }
        messages:
          type: array
          items: { $ref: "#/components/schemas/SharedMessage" }
    Health:
      type: object
      required:
        [status, apiVersion, serverVersion, serverTime, mock, hasApiKey, models]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        apiVersion:
          type: string
          example: v1
        serverVersion:
          type: string
          example: 0.2.0
        serverTime:
          type: string
          format: date-time
        mock:
          type: boolean
        hasApiKey:
          type: boolean
        models:
          type: object
          required: [default, reasoner]
          properties:
            default:
              type: string
            reasoner:
              type: string

    Model:
      type: object
      required: [id, thinking, default]
      properties:
        id:
          type: string
        thinking:
          type: boolean
        default:
          type: boolean

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 200000

    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChatMessage"
        thinking:
          type: boolean
          default: false

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - INVALID_ARGUMENT
                - UNAUTHORIZED
                - SESSION_REVOKED
                - FORBIDDEN
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - RATE_LIMITED
                - INTERNAL
                - UPSTREAM_AUTH_FAILED
                - UPSTREAM_ERROR
                - UPSTREAM_NOT_CONFIGURED
                - UPSTREAM_TIMEOUT
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
