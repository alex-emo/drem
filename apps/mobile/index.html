<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Dream</title>
    <script>
      (function () {
        var root = document.documentElement;
        var isIOS = false;
        try {
          isIOS =
            (window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'ios') ||
            /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        } catch (error) {}
        // 只在 iOS 启用 viewport-fit=cover，让 env(safe-area-inset-*) 生效；
        // Android 继续由 Capacitor SystemBars 的原生 padding 处理，避免布局回归。
        if (isIOS) {
          var viewport = document.querySelector('meta[name="viewport"]');
          if (viewport) viewport.setAttribute('content', 'width=device-width,initial-scale=1,viewport-fit=cover');
        }
        var preference = null;
        try {
          preference = localStorage.getItem('chat-demo:theme-preference');
        } catch (error) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          root.setAttribute('data-boot-dark', '');
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', '#000000');
        }
      })();
    </script>
    <style>
      #boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); background: #ffffff; color: #1f2328; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; z-index: 9999; }
      #boot .logo { box-sizing: border-box; width: 46px; height: 46px; padding: 6px; border-radius: 13px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.08); }
      #boot .logo svg { display: block; width: 100%; height: 100%; }
      #boot p { margin: 0; color: #6b7280; font-size: 13px; line-height: 1.7; max-width: 300px; text-align: center; }
      html[data-boot-dark] { color-scheme: dark; }
      html[data-boot-dark] #boot { background: #000000; color: #f2f2f7; }
      html[data-boot-dark] #boot p { color: #8e8e93; }
      #boot button { padding: 9px 22px; border: 0; border-radius: 20px; background: #5686fe; color: #fff; font-size: 14px; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.tsx"></script>
    <div id="root"></div>
    <div id="boot">
      <div class="logo" aria-hidden="true">
        <svg viewBox="200 200 640 640" focusable="false"><defs><linearGradient id="boot-mark" x1="240" y1="220" x2="780" y2="800" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c4f8ff"/><stop offset="0.42" stop-color="#69dcff"/><stop offset="1" stop-color="#4f6bff"/></linearGradient><linearGradient id="boot-star" x1="470" y1="450" x2="610" y2="590" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff7d6"/><stop offset="1" stop-color="#ffae36"/></linearGradient></defs><path d="M575 245 C735 275 805 420 775 555 C740 710 570 790 430 735 C290 680 245 520 320 405 C395 290 545 270 640 350 C715 414 715 535 640 590" fill="none" stroke="url(#boot-mark)" stroke-width="92" stroke-linecap="round"/><path fill="url(#boot-star)" d="M520 442 C530 488 558 508 604 518 C558 528 530 548 520 594 C510 548 482 528 436 518 C482 508 510 488 520 442 Z"/></svg>
      </div>
      <p>正在加载 Dream…</p>
    </div>
    <script>
      (function () {
        var logo = '<div class="logo" aria-hidden="true"><svg viewBox="200 200 640 640" focusable="false"><defs><linearGradient id="boot-mark" x1="240" y1="220" x2="780" y2="800" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c4f8ff"/><stop offset="0.42" stop-color="#69dcff"/><stop offset="1" stop-color="#4f6bff"/></linearGradient><linearGradient id="boot-star" x1="470" y1="450" x2="610" y2="590" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff7d6"/><stop offset="1" stop-color="#ffae36"/></linearGradient></defs><path d="M575 245 C735 275 805 420 775 555 C740 710 570 790 430 735 C290 680 245 520 320 405 C395 290 545 270 640 350 C715 414 715 535 640 590" fill="none" stroke="url(#boot-mark)" stroke-width="92" stroke-linecap="round"/><path fill="url(#boot-star)" d="M520 442 C530 488 558 508 604 518 C558 528 530 548 520 594 C510 548 482 528 436 518 C482 508 510 488 520 442 Z"/></svg></div>';
        var timer = setTimeout(function () {
          if (window.__dreamBooted) return;
          var boot = document.getElementById('boot');
          if (!boot) return;
          boot.innerHTML = logo + '<h1 style="font-size:18px;margin:6px 0">页面加载超时</h1><p>请检查网络后重试；如果反复失败，可能是系统 WebView 过旧，请在应用商店更新系统 WebView 或重新安装 Dream。</p><button onclick="location.reload()">重新加载</button>';
        }, 15000);
        window.addEventListener('error', function () {
          if (window.__dreamBooted) return;
          var boot = document.getElementById('boot');
          if (boot) boot.innerHTML = logo + '<h1 style="font-size:18px;margin:6px 0">页面加载出错</h1><p>请尝试重新加载。若持续失败，请更新系统 WebView 或联系支持。</p><button onclick="location.reload()">重新加载</button>';
          clearTimeout(timer);
        }, true);
      })();
    </script>
  </body>
</html>
