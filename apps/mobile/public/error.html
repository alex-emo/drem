<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dream</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; box-sizing: border-box; display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); background: #000; color: #f2f2f7; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
      .card { max-width: 340px; padding: 28px 24px; border: 1px solid #2c2c2e; border-radius: 18px; background: #1c1c1e; text-align: center; }
      .logo { box-sizing: border-box; width: 42px; height: 42px; margin: 0 auto 14px; padding: 5px; border-radius: 12px; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
      .logo svg { display: block; width: 100%; height: 100%; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: #8e8e93; font-size: 13px; line-height: 1.7; margin: 0 0 18px; }
      button { width: 100%; padding: 11px; border: 0; border-radius: 22px; background: #5686fe; color: #fff; font-size: 14px; }
      button.secondary { margin-top: 8px; background: transparent; border: 1px solid #3a3a3c; color: #c7c7cc; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="200 200 640 640" focusable="false"><defs><linearGradient id="error-mark" x1="240" y1="220" x2="780" y2="800" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c4f8ff"/><stop offset="0.42" stop-color="#69dcff"/><stop offset="1" stop-color="#4f6bff"/></linearGradient><linearGradient id="error-star" x1="470" y1="450" x2="610" y2="590" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff7d6"/><stop offset="1" stop-color="#ffae36"/></linearGradient></defs><path d="M575 245 C735 275 805 420 775 555 C740 710 570 790 430 735 C290 680 245 520 320 405 C395 290 545 270 640 350 C715 414 715 535 640 590" fill="none" stroke="url(#error-mark)" stroke-width="92" stroke-linecap="round"/><path fill="url(#error-star)" d="M520 442 C530 488 558 508 604 518 C558 528 530 548 520 594 C510 548 482 528 436 518 C482 508 510 488 520 442 Z"/></svg>
      </div>
      <h1>页面加载失败</h1>
      <p>请检查网络后重试。如果仍然失败，请更新系统 WebView（Android）或升级 iOS 后重试。</p>
      <button onclick="location.reload()">重新加载</button>
      <button class="secondary" onclick="window.open('https://dream.pum.org.cn','_blank')">在浏览器中打开</button>
    </div>
  </body>
</html>
